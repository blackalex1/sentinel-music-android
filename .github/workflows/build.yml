name: Build & Release Sentinel Music Android

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android APK
        run: ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk dist-artifacts/Sentinel-Music-v0.0.1.apk
          ls -la dist-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-music-android-apk
          path: dist-artifacts/*.apk

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/Sentinel-Music-v0.0.1.apk
          draft: false
          prerelease: false
          generate_release_notes: true
